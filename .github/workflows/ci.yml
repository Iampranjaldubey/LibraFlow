name: CI

on:
  push:
    branches: [main, resume-prep]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · build · test · coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      # `verify` runs the full suite — including the Testcontainers MySQL
      # integration tests, which execute here because the runner has Docker —
      # and enforces the JaCoCo coverage gate.
      - name: Build, test, and verify coverage
        run: ./mvnw -B --no-transfer-progress verify

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco
          if-no-files-found: ignore

  frontend:
    name: Frontend · type-check · test · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm type-check

      - name: Unit tests
        run: pnpm test:run

      - name: Production build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080

  docker:
    name: Docker · images build · full-stack smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      # Builds db + backend + frontend images and waits until every container's
      # healthcheck passes (backend readiness includes the DB connection).
      - name: Start full stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Smoke test
        run: |
          set -euo pipefail
          F=http://localhost:3000
          check() { test "$2" = "$3" || { echo "FAIL $1: expected $3 got $2"; exit 1; }; echo "ok   $1"; }

          check "readiness probe" "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/actuator/health/readiness)" 200
          check "login page"      "$(curl -s -o /dev/null -w '%{http_code}' $F/login)" 200
          check "dashboard gated" "$(curl -s -o /dev/null -w '%{http_code}' $F/dashboard)" 307
          curl -sI $F/login | grep -qi '^content-security-policy:' && echo "ok   CSP header"

          # Demo admin logs in through the same-origin proxy; refresh token only in a cookie
          BODY=$(curl -s -c cj -X POST $F/api/v1/auth/login -H 'Content-Type: application/json' \
                  -d '{"email":"admin@libraflow.dev","password":"LibraFlow@2026"}')
          TOKEN=$(echo "$BODY" | jq -r .data.token)
          check "demo admin role"  "$(echo "$BODY" | jq -r .data.role)" ADMIN
          check "no token in body" "$(echo "$BODY" | jq -r '.data.refreshToken // "absent"')" absent
          grep -q refresh_token cj && echo "ok   refresh cookie set"
          check "seeded books"     "$(curl -s -H "Authorization: Bearer $TOKEN" $F/api/v1/books | jq '.data | length')" 12
          check "refresh rotation" "$(curl -s -b cj -o /dev/null -w '%{http_code}' -X POST $F/api/v1/auth/refresh)" 200

          # Rate limiter: default burst is 10, so the 11th bad login must be 429
          for i in $(seq 1 10); do curl -s -o /dev/null -X POST $F/api/v1/auth/login \
            -H 'Content-Type: application/json' -d '{"email":"x@y.dev","password":"wrongpass1"}'; done
          check "rate limit" "$(curl -s -o /dev/null -w '%{http_code}' -X POST $F/api/v1/auth/login \
            -H 'Content-Type: application/json' -d '{"email":"x@y.dev","password":"wrongpass1"}')" 429

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v
