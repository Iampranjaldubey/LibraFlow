# ── Server ──────────────────────────────────────────────────────────────────────
server.port=${PORT:8080}
# Trust the X-Forwarded-Proto / X-Forwarded-For headers injected by Railway's
# reverse proxy so that Spring (and springdoc) see "https" as the scheme instead
# of the internal "http" used between the proxy and the app container.
server.forward-headers-strategy=framework
# Finish in-flight requests on SIGTERM (platform redeploys) instead of dropping them.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.compression.enabled=true
server.compression.mime-types=application/json,application/pdf,text/html,text/plain
server.error.include-stacktrace=never
server.error.include-message=never

# ── Actuator: Kubernetes-style probes ──────────────────────────────────────────
# /actuator/health/liveness  -> process is alive (no dependency checks)
# /actuator/health/readiness -> alive AND the database answers; used by the
#                               container healthcheck and the platform deploy gate.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db
management.health.mail.enabled=false
management.info.env.enabled=true
info.app.name=LibraFlow API
info.app.version=@project.version@

# ── DataSource (MySQL) ──────────────────────────────────────────────────────────

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ──────────────────────────────────────────────────────────────
# Use 'validate' so Hibernate checks schema on startup but never modifies it.
# Schema changes are managed by Flyway migrations (see db/migration/).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
# Keep the Hibernate session open for the full HTTP request so lazy relations
# can be accessed during response serialisation (Open Session in View pattern).
spring.jpa.open-in-view=true

# ── Flyway Database Migrations ────────────────────────────────────────────────────
spring.flyway.enabled=true
# baseline-on-migrate allows Flyway to adopt a database that was previously
# managed by Hibernate ddl-auto without failing on existing tables.
spring.application.name=library-management

# Google OAuth2 — OPTIONAL. Registered only when GOOGLE_CLIENT_ID is non-blank
# (see GoogleOAuth2Config); otherwise Google login is disabled and the UI hides it.
# GOOGLE_REDIRECT_URI must point at the FRONTEND origin in production, because the
# browser reaches the API through the Next.js same-origin proxy:
#   https://<frontend-host>/login/oauth2/code/google
app.oauth2.google.client-id=${GOOGLE_CLIENT_ID:}
app.oauth2.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.oauth2.google.redirect-uri=${GOOGLE_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# ── JWT ───────────────────────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET}
# Access token expiry: 15 minutes (900000 ms)
app.jwt.expiration-ms=900000
# Refresh token expiry: 7 days (604800000 ms)
app.jwt.refresh-expiration-ms=604800000

# ── Jackson ───────────────────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false

# ── SpringDoc / Swagger ───────────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha

# ── Email (SMTP) ──────────────────────────────────────────────────────────────
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ── Application Settings ─────────────────────────────────────────────────────
app.mail.from=${MAIL_FROM:noreply@libraflow.dev}
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# ── Auth refresh-token cookie ─────────────────────────────────────────────────
# The refresh token is delivered ONLY via an HttpOnly cookie (never the JSON body),
# so it is not readable by JavaScript/XSS. Production default assumes a cross-site
# setup (Vercel frontend -> Railway API): SameSite=None + Secure=true.
# For same-origin local dev over http, override to Lax/false (see docker-compose.yml).
app.auth.refresh-cookie.secure=${REFRESH_COOKIE_SECURE:true}
app.auth.refresh-cookie.same-site=${REFRESH_COOKIE_SAMESITE:None}
app.auth.refresh-cookie.path=/api/v1/auth

# ── Email verification ──────────────────────────────────────────────────────────
# Requires working SMTP (MAIL_*). Deployments without SMTP must set this to false.
app.auth.require-email-verification=${APP_AUTH_REQUIRE_EMAIL_VERIFICATION:true}

# ── CORS ────────────────────────────────────────────────────────────────────────
# FRONTEND_URL is always allowed; add more exact origins comma-separated.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# ── Rate limiting (credential endpoints) ────────────────────────────────────────
# Token bucket per client IP + endpoint: burst of CAPACITY, refilled at
# REFILL_PER_MINUTE. Exceeding it returns 429 with Retry-After.
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.auth.capacity=${RATE_LIMIT_AUTH_CAPACITY:10}
app.rate-limit.auth.refill-per-minute=${RATE_LIMIT_AUTH_REFILL_PER_MINUTE:10}

# ── Demo data (OFF by default) ─────────────────────────────────────────────────
# APP_DEMO_SEED=true creates admin@/librarian@/member@libraflow.dev with
# APP_DEMO_PASSWORD plus a sample catalogue. Only for public demo instances.
app.demo.seed=${APP_DEMO_SEED:false}
app.demo.password=${APP_DEMO_PASSWORD:}

