# Profile for Testcontainers MySQL integration tests.
#
# Unlike the default `test` profile (H2 + Hibernate create-drop + Flyway OFF),
# this profile runs the REAL Flyway migrations against a real MySQL container
# and asks Hibernate to VALIDATE the resulting schema against the JPA entities.
# The datasource URL/credentials are injected at runtime via @DynamicPropertySource
# from the started container, so they are intentionally absent here.

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.jpa.show-sql=false

# JWT (same throwaway Base64 secret used by the H2 test profile; >32 bytes for HS256)
app.jwt.secret=dGhpc2lzYXZlcnlzdHJvbmdzZWNyZXRrZXlmb3JsaWJyYXJ5bWFuYWdlbWVudHN5c3RlbTIwMjQ=
app.jwt.expiration-ms=3600000
app.jwt.refresh-expiration-ms=604800000

# Don't require email verification (or send email) during tests
app.auth.require-email-verification=false

# Exclude OAuth2 auto-configuration to prevent context failure without client-id
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration

# Rate limiting is covered by RateLimitFilterTest / RateLimitIntegrationTest;
# keep it off so suites that log in repeatedly are not throttled.
app.rate-limit.enabled=false
