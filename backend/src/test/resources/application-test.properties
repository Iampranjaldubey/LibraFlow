spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Disable Flyway for tests since we are using Hibernate auto-ddl with H2
spring.flyway.enabled=false

# ── JWT (test) — keys must match what the app actually reads (app.jwt.*) ──
# Base64-encoded secret; decodes to >32 bytes as required for HS256.
app.jwt.secret=dGhpc2lzYXZlcnlzdHJvbmdzZWNyZXRrZXlmb3JsaWJyYXJ5bWFuYWdlbWVudHN5c3RlbTIwMjQ=
app.jwt.expiration-ms=3600000
app.jwt.refresh-expiration-ms=604800000

# Don't require email verification (or send email) during tests
app.auth.require-email-verification=false

# Deterministic refresh-cookie attributes for tests (no HTTPS in the test client)
app.auth.refresh-cookie.secure=false
app.auth.refresh-cookie.same-site=Lax

# ── OAuth2 ────────────────────────────────────────────────────────────────────
# The main application.properties registers a Google OAuth2 client via
# ${GOOGLE_CLIENT_ID:} / ${GOOGLE_CLIENT_SECRET:}. In tests those env vars are
# absent, and Spring Boot's validation rejects an empty client-id. Excluding
# the auto-configuration avoids the error without needing dummy credentials.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration

# Rate limiting is covered by RateLimitFilterTest / RateLimitIntegrationTest;
# keep it off so suites that log in repeatedly are not throttled.
app.rate-limit.enabled=false
